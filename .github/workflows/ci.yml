name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (non-blocking until pre-existing errors are fixed)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          # Placeholders: every route renders per request (nonce CSP), so the build
          # compiles without contacting Supabase/Mapbox. Real values live in Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          NEXT_PUBLIC_MAPBOX_TOKEN: placeholder
          NEXT_TELEMETRY_DISABLED: "1"

  secrets:
    # Second line of defence behind .githooks/pre-commit: catches anything pushed with
    # --no-verify or from a machine without the hook.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full history
        run: gitleaks git --redact --no-banner -v .
      - name: Commit emails must be GitHub noreply
        run: |
          bad=$(git log --format='%ae%n%ce' | sort -u | grep -v '@users.noreply.github.com$' | grep -v '^noreply@github.com$' | grep -v '^noreply@anthropic.com$' || true)
          if [ -n "$bad" ]; then echo "::error::Non-noreply commit emails found"; echo "$bad" | sed -E 's/^(.).*@/\1***@/'; exit 1; fi
