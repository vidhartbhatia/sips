name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and DB tests
        # Vitest + PGlite (in-memory Postgres): migrations, RLS, and pure helpers. No network.
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Placeholders: every route renders per request (nonce CSP), so the build
          # compiles without contacting Supabase/Mapbox. Real values live in Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          NEXT_PUBLIC_MAPBOX_TOKEN: placeholder
          NEXT_TELEMETRY_DISABLED: "1"

  smoke:
    # Playwright smoke suite against a production build reading the live Supabase project.
    # The three NEXT_PUBLIC_* values are repo *variables*, not secrets: they ship in the
    # site's client JS anyway. The publishable key only gets what RLS allows anon users.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
      # Never the real service-role key in CI. Photo signing fails soft (no photos).
      SUPABASE_SECRET_KEY: placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Fork and Dependabot PRs may not get repo variables. Skip those with a notice
      # rather than going red; anywhere else a missing variable is a real error.
      # (No hardcoded fallback: the project ref is kept out of the repo on purpose.)
      - name: Check public variables are set
        id: vars
        env:
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: |
          missing=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_MAPBOX_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$UNTRUSTED_PR" = "true" ]; then
            echo "::notice::Smoke tests skipped: Actions variables unavailable to this PR (fork or Dependabot):$missing"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Actions variables not set:$missing"
          exit 1
      - uses: actions/checkout@v4
        if: steps.vars.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.vars.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.vars.outputs.run == 'true'
      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.vars.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.vars.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium OS dependencies
        if: steps.vars.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build
        if: steps.vars.outputs.run == 'true'
        run: npm run build
      - name: Smoke tests
        if: steps.vars.outputs.run == 'true'
        # playwright.config.ts starts `next start` on :3000 and waits for it.
        run: npm run test:e2e
      - name: Upload Playwright report
        # always, not only on failure: specs attach screenshots for human review
        if: ${{ !cancelled() && steps.vars.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  secrets:
    # Second line of defence behind .githooks/pre-commit: catches anything pushed with
    # --no-verify or from a machine without the hook.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Scan full history
        run: gitleaks git --redact --no-banner -v .
      - name: New commits use GitHub noreply emails
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          range=${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
          bad=$(git log --format='%ae' "$range" | sort -u | grep -vE '@users\.noreply\.github\.com$|^noreply@(github|anthropic)\.com$' || true)
          if [ -n "$bad" ]; then echo "::error::New commits use a personal email"; echo "$bad" | sed -E 's/^(.).*@/\1***@/'; exit 1; fi

  signed-in:
    # The signed-in golden path (login with the emailed code, capture with a photo, publish,
    # public page) against a throwaway LOCAL Supabase stack with the real migrations.
    # Never touches production. See e2e/signed-in/.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Start local Supabase (real migrations)
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Point the app at the local stack
        run: |
          supabase status -o env | node -e '
            const v = {};
            for (const l of require("fs").readFileSync(0, "utf8").split("\n")) {
              const m = l.match(/^(\w+)="?(.*?)"?$/); if (m) v[m[1]] = m[2];
            }
            const out = {
              NEXT_PUBLIC_SUPABASE_URL: v.API_URL,
              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: v.PUBLISHABLE_KEY,
              SUPABASE_SECRET_KEY: v.SECRET_KEY,
              MAILPIT_URL: v.MAILPIT_URL,
              NEXT_PUBLIC_MAPBOX_TOKEN: "placeholder",
              ALLOWED_EMAILS: "e2e-admin@example.com",
              E2E_LOCAL_SUPABASE: "1",
              NEXT_TELEMETRY_DISABLED: "1",
            };
            console.log(Object.entries(out).map(([k, x]) => `${k}=${x}`).join("\n"));
          ' >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build against the local stack
        run: npm run build
      - name: Seed and run the golden path
        run: |
          node e2e/signed-in/seed.mjs
          (npx next start -p 3100 > server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3100/ || (cat server.log; exit 1)
          npx playwright test -c playwright.signed-in.config.ts
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signed-in-trace
          path: test-results/
          retention-days: 7
